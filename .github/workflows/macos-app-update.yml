name: WeekGlass macOS app update

on:
  push:
    branches: [validation/macos-upgrade-57-58]

permissions:
  contents: read

jobs:
  upgrade:
    if: github.repository == 'Vilianastclair/WeekGlass-macOS-validation' && github.event.created
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare Flutter
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          version="$(plutil -extract flutter.version raw -o - tooling/versions.json)"
          channel="$(plutil -extract flutter.channel raw -o - tooling/versions.json)"
          archive="$RUNNER_TEMP/weekglass-flutter.zip"
          trap 'rm -f -- "$archive"' EXIT
          curl --fail --location --retry 2 --silent --show-error \
            "https://storage.googleapis.com/flutter_infra_release/releases/$channel/macos/flutter_macos_arm64_${version}-$channel.zip" -o "$archive"
          /usr/bin/ditto -x -k "$archive" "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build both versions and run one installed app upgrade
        shell: bash
        run: bash tooling/scripts/prepare-macos-app-update.sh
      - name: Save only the test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: WeekGlass macOS upgrade evidence
          path: apps/client/build/weekglass-macos/verification/
          if-no-files-found: ignore
          retention-days: 2
