name: WeekGlass macOS verification

on:
  push:
    branches: [ci/macos-validation, ci/macos-validation-arm64]

permissions:
  contents: read

concurrency:
  group: macos-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.ref_name == 'ci/macos-validation-arm64' && '["arm64"]' || '["arm64","x64"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Intel JDK for the Intel course runtime
        if: matrix.arch == 'x64'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Install the pinned Flutter SDK
        shell: bash
        run: |
          version="$(/usr/bin/plutil -extract flutter.version raw -o - tooling/versions.json)"
          channel="$(/usr/bin/plutil -extract flutter.channel raw -o - tooling/versions.json)"
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            /usr/bin/arch -x86_64 /usr/bin/true
            sdk=flutter_macos
          else
            sdk=flutter_macos_arm64
          fi
          archive="$RUNNER_TEMP/weekglass-flutter.zip"
          trap 'rm -f -- "$archive"' EXIT
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/flutter_infra_release/releases/$channel/macos/${sdk}_${version}-${channel}.zip" \
            --output "$archive"
          /usr/bin/ditto -x -k "$archive" "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare the native offline course parser
        id: course
        shell: bash
        run: |
          evidence=apps/client/build/weekglass-macos/verification
          mkdir -p "$evidence"
          {
            if [[ "${{ matrix.arch }}" == x64 ]]; then
              java_home="$JAVA_HOME"; shell_arch=x86_64
            else
              java_home="$(/usr/libexec/java_home -a arm64 -v 17)"; shell_arch=arm64
            fi
            export JAVA_HOME="$java_home"
            portable="$RUNNER_TEMP/weekglass-portable/course_adapter"
            archive="$RUNNER_TEMP/weekglass-course-adapter.zip"
            native="$RUNNER_TEMP/weekglass-native/course_adapter"
            python3 tooling/course_adapter_engine/build.py --dist "$portable"
            cp apps/client/windows/course_adapter/parser.policy "$portable/parser.policy"
            /usr/bin/ditto -c -k --keepParent "$portable" "$archive"
            /usr/bin/arch "-$shell_arch" /bin/bash tooling/scripts/prepare-macos-course-adapter.sh "$archive" "$java_home" "$native"
            printf 'WEEKGLASS_MAC_COURSE_RUNTIME_DIR=%s\n' "$native" >> "$GITHUB_ENV"
          } 2>&1 | tee "$evidence/course-preparation.log"

      - name: Test the native window and package the app
        if: github.ref_name == 'ci/macos-validation-arm64'
        id: acceptance
        shell: bash
        timeout-minutes: 45
        run: |
          evidence=apps/client/build/weekglass-macos/verification
          mkdir -p "$evidence"
          {
            printf 'Login session: %s\n' "$(launchctl managername)"
            bash tooling/scripts/test-macos.sh --package --verify-launch
          } 2>&1 | tee "$evidence/workflow.log"

      - name: Restore the signed credential service for this architecture
        if: github.ref_name == 'ci/macos-validation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tooling/macos-account/restore-frozen.sh ${{ matrix.arch }}
          echo "PRIVATE_SUCCESSOR=$(python3 tooling/macos-account/version.py fixture)" >> "$GITHUB_ENV"
      - name: Seal the native app-a signing input
        if: github.ref_name == 'ci/macos-validation'
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == x64 ]]; then cpu=x86_64; else cpu=arm64; fi
          /usr/bin/arch "-$cpu" /bin/bash tooling/macos-account/native-stage.sh seal app-a-${{ matrix.arch }}
      - name: Send the app-a request to the maintainer
        if: github.ref_name == 'ci/macos-validation'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: WeekGlass native request app-a-${{ matrix.arch }}
          path: ${{ runner.temp }}/weekglass-signing/request-app-a-${{ matrix.arch }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Verify and install the returned app-a signature
        if: github.ref_name == 'ci/macos-validation'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ matrix.arch }}" == x64 ]]; then cpu=x86_64; else cpu=arm64; fi
          /usr/bin/arch "-$cpu" /bin/bash tooling/macos-account/native-stage.sh receive app-a-${{ matrix.arch }}
      - name: Validate the production app from a disk image
        id: distribution
        shell: bash
        timeout-minutes: 30
        run: |
          if [[ "${{ matrix.arch }}" == x64 ]]; then cpu=x86_64; else cpu=arm64; fi
          if [[ "$GITHUB_REF_NAME" == ci/macos-validation ]]; then
            /usr/bin/arch "-$cpu" /bin/bash tooling/scripts/package-macos.sh --signed-app "$RUNNER_TEMP/weekglass-signing/A/WeekGlass.app"
          else
            bash tooling/scripts/package-macos.sh --course-asset "$WEEKGLASS_MAC_COURSE_RUNTIME_DIR"
          fi

      - name: Upload runtime evidence
        if: ${{ !cancelled() && steps.course.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WeekGlass macOS ${{ matrix.arch }} runtime evidence
          path: apps/client/build/weekglass-macos/verification/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the validated debug candidate
        if: ${{ !cancelled() && github.ref_name == 'ci/macos-validation-arm64' && steps.acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WeekGlass macOS ${{ matrix.arch }} debug candidate
          path: apps/client/build/weekglass-macos/WeekGlass-macOS-debug.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the validated distribution candidate
        if: ${{ !cancelled() && steps.distribution.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WeekGlass macOS ${{ matrix.arch }} distribution candidate
          path: |
            apps/client/build/weekglass-macos/WeekGlass-macOS-*.dmg
            apps/client/build/weekglass-macos/WeekGlass-macOS-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Seal the native app-b signing input
        if: github.ref_name == 'ci/macos-validation' && matrix.arch == 'arm64' && env.PRIVATE_SUCCESSOR != ''
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == x64 ]]; then cpu=x86_64; else cpu=arm64; fi
          /usr/bin/arch "-$cpu" /bin/bash tooling/macos-account/native-stage.sh seal app-b-${{ matrix.arch }}
      - name: Send the app-b request to the maintainer
        if: github.ref_name == 'ci/macos-validation' && matrix.arch == 'arm64' && env.PRIVATE_SUCCESSOR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: WeekGlass native request app-b-${{ matrix.arch }}
          path: ${{ runner.temp }}/weekglass-signing/request-app-b-${{ matrix.arch }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Verify and install the returned app-b signature
        if: github.ref_name == 'ci/macos-validation' && matrix.arch == 'arm64' && env.PRIVATE_SUCCESSOR != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ matrix.arch }}" == x64 ]]; then cpu=x86_64; else cpu=arm64; fi
          /usr/bin/arch "-$cpu" /bin/bash tooling/macos-account/native-stage.sh receive app-b-${{ matrix.arch }}
      - name: Create the private signed successor disk image
        if: github.ref_name == 'ci/macos-validation' && matrix.arch == 'arm64' && env.PRIVATE_SUCCESSOR != ''
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/private-image"
          ditto "$RUNNER_TEMP/weekglass-signing/B/WeekGlass.app" "$RUNNER_TEMP/private-image/WeekGlass.app"
          ln -s /Applications "$RUNNER_TEMP/private-image/Applications"
          hdiutil create -srcfolder "$RUNNER_TEMP/private-image" -volname WeekGlass -format UDZO -fs HFS+ "$RUNNER_TEMP/WeekGlass-private-arm64-$PRIVATE_SUCCESSOR.dmg"
      - name: Save only the private successor
        if: github.ref_name == 'ci/macos-validation' && matrix.arch == 'arm64' && env.PRIVATE_SUCCESSOR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: WeekGlass private successor arm64
          path: ${{ runner.temp }}/WeekGlass-private-arm64-${{ env.PRIVATE_SUCCESSOR }}.dmg
          compression-level: 0
          retention-days: 3
