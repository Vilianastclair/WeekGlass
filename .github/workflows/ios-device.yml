name: iPhone device package

on:
  push:
    branches: [ci/ios-device]

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'Vilianastclair/WeekGlass' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          version="$(plutil -extract flutter.version raw -o - tooling/versions.json)"
          archive="$RUNNER_TEMP/iphone-flutter.zip"
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${version}-stable.zip" -o "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and inspect the iPhone release
        run: python3 -u tooling/scripts/package_ios_device.py
      - name: Check that all simulators are off
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices -j | python3 -c 'import json, sys; active = [d["name"] for devs in json.load(sys.stdin)["devices"].values() for d in devs if d["state"] != "Shutdown"]; print("Active simulators:", active); sys.exit(bool(active))'
      - name: Collect the device package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: WeekGlass iOS device package
          path: apps/client/build/ios/device-package/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
