# Include in the public website's HTTPS server block.
# The signed in-app update routes are configured separately.

location = /download/windows {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    add_header Allow "GET, HEAD" always;
    add_header Cache-Control "no-cache, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    return 302 "https://cnb.cool/viliana-weekglass/downloads/-/releases/download/v0.20.17/WeekGlass-Setup-0.20.17-Windows-x64.exe";
}

