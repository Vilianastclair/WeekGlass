    <p class="eyebrow"><span></span> 独立开发</p>
    <h1>支持 <em>WeekGlass</em></h1>
    <p class="lead">如果 WeekGlass 帮你把一周安排得更从容，欢迎用微信请我喝杯咖啡。金额随意，一次即可。</p>

  </div>
  <section class="support-card glass" aria-labelledby="wechat-support">
    <h2 id="wechat-support">友情赞助</h2>
    <div class="support-code">
      <img src="https://cloud.viliana.cn/assets/weekglass-wechat-appreciation.png" width="1027" height="1027" alt="Viliana 的微信赞赏码">
    </div>
    <p>用微信扫一扫。用手机浏览时，保存图片后在微信「扫一扫」里从相册选取。</p>
    <a class="button" href="https://cloud.viliana.cn/assets/weekglass-wechat-appreciation.png" download="WeekGlass-赞赏码.png">保存赞赏码</a>
  </section>
