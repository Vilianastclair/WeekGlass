<body>
<header class="shell top"><a class="brand" href="/"><img src="/assets/weekglass-mark.png" width="36" height="36" alt="">WeekGlass</a></header>
<main class="shell page">
  <div class="page-head">
    <h1>iPhone 预览版</h1>
    <p class="lead">离线安排一周，暂不支持云同步。</p>
  </div>
  <p>适用于 iOS 15 及以上。请在电脑上用自己的 Apple 账号签名安装；免费签名有效期为 7 天。</p>
  <p><a class="button primary" href="/download/ios-ipa">下载 IPA <span aria-hidden="true">↓</span></a></p>
  <details>
    <summary>如何安装和续签？</summary>
    <ol>
      <li>在 Windows 或 Mac 上安装 <a href="https://altstore.io/">AltServer</a>，用数据线连接 iPhone。</li>
      <li>按住 Shift（Windows）或 Option（Mac），点击 AltServer 图标，选择「Sideload .ipa…」，打开下载的 IPA。</li>
      <li>按提示使用自己的 Apple 账号签名安装。免费账号需在 7 天内用同一账号续签。</li>
    </ol>
  </details>
</main>
</body>
