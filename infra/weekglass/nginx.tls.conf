worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 20s;
    limit_req_zone $binary_remote_addr zone=api_limit:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    gzip off;
    etag on;
    max_ranges 1;
    # Only the Docker host's WeekGlass front-network gateway may supply the
    # client IP. Direct public :8443 callers cannot spoof forwarding headers.
    set_real_ip_from 172.21.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        server_name cloud.viliana.cn;
        limit_conn connections 12;
        location = /v1/source/weekglass-cloud-20261117-admin.tar.gz {
            alias /srv/updates/source/weekglass-cloud-20261117-admin.tar.gz;
            default_type application/gzip;
            limit_except GET { deny all; }
            add_header Cache-Control "public, max-age=300, no-transform";
            add_header Content-Disposition 'attachment; filename="weekglass-cloud-20261117-admin.tar.gz"';
            add_header X-Content-Type-Options nosniff always;
        }
        # The account console and its assets/forms share the API origin. Match
        # /account itself as well as descendants, never lookalike prefixes.
        location ~ ^/account(?:/|$) {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
            add_header Link '<https://cloud.viliana.cn/v1/source/weekglass-cloud-20261117-admin.tar.gz>; rel="related"; type="application/gzip"; title="WeekGlass Cloud corresponding source"' always;
        }
        location ~ ^/v1/auth/(authorize|email)$ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
            add_header Link '<https://cloud.viliana.cn/v1/source/weekglass-cloud-20261117-admin.tar.gz>; rel="related"; type="application/gzip"; title="WeekGlass Cloud corresponding source"' always;
        }
        location /v1/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
            add_header Link '<https://cloud.viliana.cn/v1/source/weekglass-cloud-20261117-admin.tar.gz>; rel="related"; type="application/gzip"; title="WeekGlass Cloud corresponding source"' always;
        }
        location = /healthz {
            proxy_pass http://api:8000;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store" always;
        }
        location ~ "^/updates/v1/objects/([a-f0-9]{2})/([a-f0-9]{64})$" {
            alias /srv/updates/objects/$1/$2;
            limit_except GET { deny all; }
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ "^/updates/v1/manifests/(windows-x64|android-arm64)/(stable|preview)/([0-9]+)/([a-f0-9]{64})\.json$" {
            alias /srv/updates/manifests/$1/$2/$3/$4.json;
            limit_except GET { deny all; }
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ "^/updates/v1/channels/(windows-x64|android-arm64)/(stable|preview)\.json$" {
            alias /srv/updates/channels/$1/$2.json;
            limit_except GET { deny all; }
            add_header Cache-Control "public, max-age=0, must-revalidate, no-transform";
            add_header X-Content-Type-Options nosniff always;
        }
        location / { return 404; }
    }
}
